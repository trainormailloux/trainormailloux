name: Update GitHub stats cards

on:
  schedule:
    - cron: "17 6 * * *"      # daily, 6:17 UTC
  workflow_dispatch:           # run on demand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Generate cards
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.svg output/stats.json
          git diff --staged --quiet || git commit -m "Update GitHub stats cards"
          git push
